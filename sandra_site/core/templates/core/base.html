{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sandra de Sá · Massoterapia{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'core/css/global.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/header.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/footer.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/sections.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/gallery.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/certifications.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/services.css' %}">
    <link rel="icon" href="{% static 'core/images/logo-title.ico' %}">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">

            <!-- LOGO -->
            <a href="{% url 'home' %}" class="logo-link">
                <span class="logo logo-text">Sandra de Sá · Massoterapia</span>
                <img src="{% static 'core/images/logo-mono.png' %}" alt="Sandra de Sá Massoterapeuta"
                    class="logo logo-image" />
            </a>

            <!-- NAV DESKTOP -->
            <nav class="nav nav-desktop">
                <a href="{% url 'home' %}#philosophy">Filosofia</a>
                <a href="{% url 'services' %}">Serviços</a>
                <a href="{% url 'gallery' %}">Galeria</a>
                <a href="{% url 'home' %}#about">Sobre</a>
                <a href="{% url 'home' %}#contact" class="nav-cta">Agendar</a>
            </nav>

            <!-- HAMBURGER -->
            <button class="menu-toggle" id="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- MOBILE MENU -->
            <div class="mobile-menu" id="mobileMenu">
                <a href="{% url 'home' %}#philosophy">Filosofia</a>
                <a href="{% url 'services' %}">Serviços</a>
                <a href="{% url 'gallery' %}">Galeria</a>
                <a href="{% url 'home' %}#about">Sobre</a>
                <a href="{% url 'home' %}#contact">Agendar</a>
            </div>

        </div>

        
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
        <img src="{% static 'core/images/sandra-massoterapeuta-logo.png' %}" alt="Sandra de Sá Massoterapeuta"
            class="footer-logo">
        <p>© 2026 Sandra de Sá · Massoterapia</p>
    </footer>

    <script src="{% static 'core/js/header-scroll.js' %}"></script>
    {% block extra_scripts %}{% endblock %}

</body>

</html>
